name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -r "../yt-notes-${VERSION}.zip" . 
          # lo zip contiene manifest.json alla radice, pronto per "Load unpacked"
          unzip -l "../yt-notes-${VERSION}.zip" | head -30
      - uses: softprops/action-gh-release@v2
        with:
          files: yt-notes-*.zip
          generate_release_notes: true
